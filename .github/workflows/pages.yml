name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'packages/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'bunfig.toml'
      - 'tsconfig*.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          bun run build
          bun run --cwd packages/design build
      - name: Build static website
        run: |
          bun run --cwd website types:check
          bun run --cwd website build
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Verify static output
        run: bun run --cwd website check:static
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
